<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="252" viewBox="0 0 440 252">
  <defs>
    <filter id="card-shadow" filterUnits="userSpaceOnUse" x="-30" y="-30" width="500" height="312" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dy="1" result="near"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="6" result="far"/>
      <feFlood flood-color="#1F2328" flood-opacity="0.24"/>
      <feComposite in2="far" operator="in" result="far-shadow"/>
      <feFlood flood-color="#1F2328" flood-opacity="0.12"/>
      <feComposite in2="near" operator="in" result="near-shadow"/>
      <feMerge>
        <feMergeNode in="far-shadow"/>
        <feMergeNode in="near-shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="14" width="400" height="195" rx="20" fill="#FFFFFF" filter="url(#card-shadow)"/>
  <svg x="20" y="14" width="400" height="195" viewBox="0 0 400 195">
        
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='400' height='195' rx='20'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='400' height='195' fill='white'/>
                <ellipse id='mask-ellipse' cx='300' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#d0d7de' fill='#ffffff' rx='20' x='0.5' y='0.5' width='399' height='194'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='200' y1='28' x2='200' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#d0d7de' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='-999' y1='28' x2='-999' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#d0d7de' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(100, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1f2328' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        16,113
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(100, 84)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1f2328' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Total Contributions
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(100, 114)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#59636e' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Feb 20, 2022 - Present
                    </text>
                </g>
            </g>
            <g style='isolation: isolate'>
                <!-- Current Streak label -->
                <g transform='translate(300, 108)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1a7f37' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Week Streak
                    </text>
                </g>

                <!-- Current Streak range -->
                <g transform='translate(300, 145)'>
                    <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#59636e' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Oct 26, 2025 - Nov 1
                    </text>
                </g>

                <!-- Ring around number -->
                <g mask='url(#mask_out_ring_behind_fire)'>
                    <circle cx='300' cy='71' r='40' fill='none' stroke='#1a7f37' stroke-width='5' style='opacity: 1; opacity: 1;'></circle>
                </g>
                <!-- Fire icon -->
                <g transform='translate(300, 19.5)' stroke-opacity='0' style='opacity: 1; opacity: 1;'>
                    <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                    <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#1a7f37' stroke-opacity='0'/>
                </g>

                <!-- Current Streak big number -->
                <g transform='translate(300, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1f2328' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='font-size: 28px;'>
                        54
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
                <!-- Longest Streak big number -->
                <g transform='translate(-999, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1f2328' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        54
                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(-999, 84)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#1f2328' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Longest Week Streak
                    </text>
                </g>

                <!-- Longest Streak range -->
                <g transform='translate(-999, 114)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#59636e' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Oct 26, 2025 - Nov 1
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
  <rect x="160" y="237" width="120" height="1" fill="#D1D9E0"/>
</svg>
